name: Binary Size
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  binary-size:
    name: Binary Size
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      - uses: tylerbutler/actions/setup-rust@c3de10f5c576265f4910698528d949179081f25b # ratchet:tylerbutler/actions/setup-rust@main
      - name: Build size check examples
        run: |
          cargo build --release --example size_check
          cargo build --release --example size_check_rustls --no-default-features --features rustls
      - uses: tylerbutler/actions/binary-size@c3de10f5c576265f4910698528d949179081f25b # ratchet:tylerbutler/actions/binary-size@main
        id: size
        with:
          paths: |
            target/release/examples/size_check
            target/release/examples/size_check_rustls
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # ratchet:marocchino/sticky-pull-request-comment@v2
        with:
          header: binary-size
          message: ${{ steps.size.outputs.report }}
